name: Build ci-base

on:
  push:
    branches: [main]
  pull_request:
  # Weekly rebuild picks up Ubuntu security updates and current CLIs.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mi-avionics/ci-base
  # Workflows pin ci-base:<MAJOR>. Bump this only for a breaking change
  # (e.g. a new Ubuntu release or removing a tool), so ci-base:1 users
  # keep working until they choose to move.
  MAJOR: "1"

jobs:
  build:
    # GitHub-hosted on purpose: this only checks Dockerfile changes (and
    # publishes a private ghcr.io copy). The on-prem runner VMs build their
    # own ci-base from a pinned commit, so this repo's CI doesn't depend on
    # the runners it builds for.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.MAJOR }},enable={{is_default_branch}}
            type=raw,value=${{ env.MAJOR }}-{{date 'YYYYMMDD'}},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ci-base:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the tools
        run: |
          docker run --rm ci-base:test bash -euo pipefail -c '
            sh -ec "set -o pipefail; [[ -n bash ]]"
            git config --system --get-all safe.directory | grep -qx "\*"
            test "$AGENT_TOOLSDIRECTORY" = /opt/hostedtoolcache
            git --version; git lfs version; jq --version; zip -v | head -2 | tail -1
            python --version; pip --version
            node --version; npm --version
            terraform version
            aws --version
            gh --version | head -1
            sf --version
            docker --version
          '

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build (from cache), now tagged and pushed. Pull requests stop
      # after the smoke test.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
